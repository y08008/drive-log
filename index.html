<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101316">
  <title>DRIVE LOG - 燃費記録デモ</title>
  <style>
    :root{--bg:#101316;--panel:#191e22;--panel2:#20262b;--line:#30383e;--ink:#f2f5f4;--muted:#94a19e;--accent:#b6ea45;--accent-d:#88bd1d;}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 85% 0,#263225 0,transparent 29%),var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
    main{max-width:520px;margin:auto;padding:28px 16px 54px}.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:23px}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.18em;color:var(--accent)}h1{font-size:26px;letter-spacing:.03em;margin:4px 0 0}.vehicle-control{display:flex;align-items:center;gap:6px}.vehicle-control select{width:118px;padding:7px 8px;font-size:11px;border-radius:8px}.add-vehicle{width:auto;margin:0;padding:7px 9px;font-size:15px;line-height:1;background:#293220;color:var(--accent)}
    .summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:linear-gradient(140deg,#1d2327,#171b1f);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 12px 25px #0003}.metric{font-size:25px;font-weight:760;letter-spacing:-.04em;color:var(--accent);margin-top:7px}.metric-date{font-size:11px;color:var(--muted);margin-top:5px;min-height:13px}.label{font-size:11px;color:var(--muted);letter-spacing:.06em}.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;background:#15191c;border:1px solid var(--line);border-radius:12px;padding:4px;margin:22px 0 12px}.tab{background:transparent;color:var(--muted);padding:10px 4px;border:0;border-radius:8px;font:700 12px inherit;margin:0}.tab.active{background:var(--panel2);color:var(--ink)}.view{display:none}.view.active{display:block}
    h2{font-size:16px;margin:0 0 15px;letter-spacing:.02em}label{display:block;color:var(--muted);font-size:12px;margin:13px 0 6px}input,select{display:block;width:100%;height:48px;background:#111518;color:var(--ink);border:1px solid #3a4449;border-radius:9px;padding:10px 12px;font-size:16px;font-family:inherit;line-height:1.2;outline:none}input[type="date"]{min-width:0;max-width:100%;min-height:48px;padding-right:8px;-webkit-appearance:none;appearance:none}input[type="date"]::-webkit-datetime-edit,input[type="date"]::-webkit-date-and-time-value{min-width:0;padding:0;text-align:left}input[type="date"]::-webkit-calendar-picker-indicator{margin:0}input:focus,select:focus{border-color:var(--accent)}.calculated{display:flex;justify-content:space-between;align-items:center;background:#13191a;border-left:3px solid var(--accent);border-radius:7px;padding:11px 12px;margin-top:12px;color:var(--muted);font-size:12px}.calculated strong{font-size:17px;color:var(--accent)}button{border:0;border-radius:10px;background:var(--accent);color:#132000;width:100%;min-height:48px;padding:13px;font:800 14px inherit;letter-spacing:.03em;cursor:pointer;margin-top:18px}.secondary{background:#293035;color:#d7e0de;margin-top:8px}.entry{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-top:1px solid var(--line)}.entry:first-of-type{border-top:0}.fuel{font-size:14px;font-weight:700}.date{font-size:12px;color:var(--muted);margin-top:3px}.km{font-size:14px;color:var(--accent);font-weight:800}.entry-side{display:flex;align-items:center;gap:10px}.delete-button,.edit-button{width:auto;min-height:0;margin:0;padding:5px 0;background:transparent;color:#9da8a5;font-size:11px;font-weight:600;letter-spacing:0;text-decoration:underline;text-underline-offset:3px}.edit-button{color:var(--accent)}.metric-tabs{display:flex;gap:7px;margin:-5px 0 14px}.metric-tab{width:auto;min-height:0;margin:0;padding:7px 10px;background:#151a1d;color:var(--muted);border:1px solid var(--line);font-size:11px;letter-spacing:0}.metric-tab.active{background:#293220;color:var(--accent);border-color:#607d29}.filters{display:grid;grid-template-columns:1.3fr .8fr .7fr;gap:7px;margin:-3px 0 17px}.filters select{height:40px;padding:7px;font-size:12px}.chart{height:195px;display:flex;align-items:end;gap:10px;padding:12px 2px 0;border-bottom:1px solid var(--line)}.bar-wrap{height:100%;flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:7px}.bar{width:100%;max-width:38px;min-height:3px;background:linear-gradient(#c9fb5e,#6f981b);border-radius:5px 5px 1px 1px}.bar-value{font-size:10px;color:var(--muted);white-space:nowrap}.bar-label{font-size:10px;color:var(--muted)}.month-row{display:flex;justify-content:space-between;margin-top:14px;color:var(--muted);font-size:12px}.month-row strong{color:var(--ink)}.utility{display:flex;justify-content:flex-end;gap:16px;margin:16px 1px}.text-button{width:auto;min-height:0;margin:0;padding:0;background:transparent;color:var(--muted);font-size:11px;text-decoration:underline;text-underline-offset:3px}.notice{font-size:11px;color:#788481;line-height:1.6;margin:22px 3px}.reset-area{margin:30px 0 0;text-align:center}.reset-button{width:auto;min-height:0;margin:0;padding:8px 12px;background:transparent;color:#89918f;border:1px solid #38413f;font-size:11px;font-weight:600;letter-spacing:0}.empty{color:var(--muted);text-align:center;padding:17px}@media(max-width:420px){main{padding:20px 12px 44px}.brand{margin-bottom:18px}.vehicle-control select{width:105px;font-size:12px}.filters{grid-template-columns:1fr 1fr}.filters select:first-child{grid-column:1 / -1}.chart{gap:6px}.entry-side{gap:7px}.km{font-size:13px}input[type="date"]{width:66.666% !important;max-width:66.666%}}
  </style>
</head>
<body>
  <main>
    <header class="brand"><div><div class="eyebrow">PERSONAL FUEL TRACKER</div><h1>DRIVE LOG</h1></div><div class="vehicle-control"><select id="vehicleSelect" aria-label="車両を選択"></select><button id="addVehicle" class="add-vehicle" type="button" aria-label="車両を追加">＋</button></div></header>
    <section class="summary"><div class="card"><div class="label">AVERAGE ECONOMY</div><div id="avg" class="metric">—</div></div><div class="card"><div class="label">LATEST COST / KM</div><div id="perKm" class="metric">—</div></div><div class="card"><div class="label">BEST ECONOMY</div><div id="best" class="metric">—</div><div id="bestDate" class="metric-date">—</div></div><div class="card"><div class="label">LOWEST ECONOMY</div><div id="worst" class="metric">—</div><div id="worstDate" class="metric-date">—</div></div></section>
    <section class="card"><h2 id="formTitle">給油を記録</h2><div class="calculated"><span>前回の給油間隔</span><strong id="lastInterval">—</strong></div><form id="form"><label>給油日</label><input id="date" type="date" required><label>前回のメーター距離（km）</label><input id="previousOdo" type="number" min="0" step="0.1" required><label>今回のメーター距離（km）</label><input id="odometer" type="number" min="0" step="0.1" placeholder="例：21,351.2" required><div class="calculated"><span>自動計算した走行距離</span><strong id="distancePreview">— km</strong></div><label>給油量（L）</label><input id="liters" type="number" min="0.1" step="0.01" placeholder="例：33.50" required><label>支払金額（円）</label><input id="cost" type="number" min="0" step="1" placeholder="例：5,762" required><button id="submitFuel" type="submit">この給油を記録</button><button id="cancelEdit" class="secondary" type="button" hidden>編集をやめる</button></form></section>
    <nav class="tabs" aria-label="表示切替"><button class="tab active" data-tab="history">履歴</button><button class="tab" data-tab="monthly">推移</button><button class="tab" data-tab="maintenance">整備</button></nav>
    <section id="history" class="view active card"><h2>給油履歴</h2><div id="list"></div><div class="utility"><input id="importFile" type="file" accept=".csv,text/csv" hidden><button id="import" class="text-button" type="button">データを読み込む</button><button id="export" class="text-button" type="button">データを書き出す</button></div></section>
    <section id="monthly" class="view card"><h2>推移</h2><div class="metric-tabs" aria-label="表示指標"><button class="metric-tab active" data-metric="cost" type="button">給油額</button><button class="metric-tab" data-metric="distance" type="button">走行距離</button></div><div class="filters"><select id="range" aria-label="表示期間"><option value="six">直近6か月</option><option value="year">年間推移</option><option value="month">月間推移</option></select><select id="year" aria-label="年"></select><select id="monthSelect" aria-label="月"></select></div><div id="chart" class="chart"></div><div class="month-row"><span id="rangeLabel">直近6か月</span><strong id="totalCost">合計 ¥0</strong></div></section>
    <section id="maintenance" class="view"><div class="card"><h2>整備を記録</h2><form id="maintenanceForm"><label>整備内容</label><input id="maintenanceName" placeholder="例：エンジンオイル交換" required><label>実施日</label><input id="maintenanceDate" type="date" required><label>実施時のメーター距離（km）</label><input id="maintenanceOdo" type="number" min="0" step="0.1" required><label>次回の目安日（任意）</label><input id="nextDate" type="date"><label>次回の目安距離（km / 任意）</label><input id="nextOdo" type="number" min="0" step="0.1"><button type="submit">整備を記録</button></form></div><div class="card"><h2>次回の整備目安</h2><div id="maintenanceList"></div></div></section>
    <p class="notice">データはこの端末・ブラウザ内にのみ保存されます。外部サーバー、会員登録、広告は使用しません。</p><div class="reset-area"><button id="resetAll" class="reset-button" type="button">全データをリセット</button></div>
  </main>
  <script>
    const key='drive-log-demo-v2',maintenanceKey='drive-log-maintenance-v1',vehiclesKey='drive-log-vehicles-v1',activeVehicleKey='drive-log-active-vehicle-v1',resetKey='drive-log-was-reset-v1';
    const seed=[
      {date:'2026-03-11',previousOdo:18730.2,odometer:19124.8,liters:30.6,cost:5141},
      {date:'2026-04-09',previousOdo:19124.8,odometer:19550.2,liters:32.4,cost:5515},
      {date:'2026-05-14',previousOdo:19550.2,odometer:19937.9,liters:30.1,cost:5217},
      {date:'2026-06-13',previousOdo:19937.9,odometer:20365.7,liters:32.8,cost:5674},
      {date:'2026-07-12',previousOdo:20365.7,odometer:20778.1,liters:31.4,cost:5401},
      {date:'2026-08-03',previousOdo:20778.1,odometer:21190.5,liters:31.2,cost:5304},
      {date:'2026-08-15',previousOdo:21190.5,odometer:21629.3,liters:33.5,cost:5762}
    ];
    let vehicles=JSON.parse(localStorage.getItem(vehiclesKey)||'null')||[{id:'default',name:'MY CAR'}],activeVehicleId=localStorage.getItem(activeVehicleKey)||vehicles[0].id,logs=JSON.parse(localStorage.getItem(key)||'null')||(localStorage.getItem(resetKey)?[]:structuredClone(seed)),maintenance=JSON.parse(localStorage.getItem(maintenanceKey)||'[]'),trendMetric='cost',editingIndex=null;
    if(!vehicles.some(x=>x.id===activeVehicleId))activeVehicleId=vehicles[0].id;logs.forEach(x=>x.vehicleId||=vehicles[0].id);maintenance.forEach(x=>x.vehicleId||=vehicles[0].id);
    const yen=n=>new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(n);
    const distance=x=>x.odometer-x.previousOdo;
    const $=s=>document.querySelector(s);
    function vehicleLogs(){return logs.filter(x=>x.vehicleId===activeVehicleId)}function vehicleMaintenance(){return maintenance.filter(x=>x.vehicleId===activeVehicleId)}
    function save(){localStorage.setItem(key,JSON.stringify(logs));}function saveMaintenance(){localStorage.setItem(maintenanceKey,JSON.stringify(maintenance));}function saveVehicles(){localStorage.setItem(vehiclesKey,JSON.stringify(vehicles));localStorage.setItem(activeVehicleKey,activeVehicleId)}
    function renderVehicleSelect(){const select=$('#vehicleSelect');select.innerHTML='';vehicles.forEach(v=>{const option=document.createElement('option');option.value=v.id;option.textContent=v.name;select.append(option)});select.value=activeVehicleId;}
    function updatePreview(){const a=+$('#previousOdo').value,b=+$('#odometer').value,d=b-a;$('#distancePreview').textContent=(a&&b&&d>0?d.toFixed(1):'—')+' km';}
    function setPreviousOdo(){const latest=[...vehicleLogs()].sort((a,b)=>b.date.localeCompare(a.date))[0];$('#previousOdo').value=latest?latest.odometer.toFixed(1):'';updatePreview();}
    function render(){
      const records=vehicleLogs(),economies=records.map(x=>distance(x)/x.liters),totalD=records.reduce((s,x)=>s+distance(x),0),totalL=records.reduce((s,x)=>s+x.liters,0),bestRecord=records.reduce((best,x)=>!best||distance(x)/x.liters>distance(best)/best.liters?x:best,null),worstRecord=records.reduce((worst,x)=>!worst||distance(x)/x.liters<distance(worst)/worst.liters?x:worst,null),latestTwo=[...records].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,2);$('#avg').textContent=totalL?(totalD/totalL).toFixed(1)+' km/L':'—';$('#best').textContent=bestRecord?(distance(bestRecord)/bestRecord.liters).toFixed(1)+' km/L':'—';$('#worst').textContent=worstRecord?(distance(worstRecord)/worstRecord.liters).toFixed(1)+' km/L':'—';$('#bestDate').textContent=bestRecord?bestRecord.date:'—';$('#worstDate').textContent=worstRecord?worstRecord.date:'—';$('#lastInterval').textContent=latestTwo.length===2?`${Math.round((new Date(latestTwo[0].date)-new Date(latestTwo[1].date))/86400000)}日 ・ ${distance(latestTwo[0]).toFixed(0)} km`:'—';
      const latest=[...records].sort((a,b)=>b.date.localeCompare(a.date))[0];$('#perKm').textContent=latest?yen(latest.cost/distance(latest))+'/km':'—';
      $('#list').innerHTML=records.length?records.map(x=>({x,index:logs.indexOf(x)})).sort((a,b)=>b.x.date.localeCompare(a.x.date)).map(({x,index})=>`<div class="entry"><div><div class="fuel">${x.date}　${x.liters.toFixed(2)} L</div><div class="date">${distance(x).toFixed(1)} km ・ ${yen(x.cost)}</div></div><div class="entry-side"><div class="km">${(distance(x)/x.liters).toFixed(1)} km/L</div><button class="edit-button" data-index="${index}" type="button">編集</button><button class="delete-button" data-index="${index}" type="button" aria-label="${x.date}の記録を削除">削除</button></div></div>`).join(''):'<div class="empty">記録はまだありません</div>';
      renderChart();
      renderMaintenance();
    }
    function resetFuelForm(){editingIndex=null;$('#form').reset();$('#date').value=new Date().toISOString().slice(0,10);setPreviousOdo();$('#formTitle').textContent='給油を記録';$('#submitFuel').textContent='この給油を記録';$('#cancelEdit').hidden=true;}
    function startEdit(index){const x=logs[index];editingIndex=index;$('#date').value=x.date;$('#previousOdo').value=x.previousOdo;$('#odometer').value=x.odometer;$('#liters').value=x.liters;$('#cost').value=x.cost;updatePreview();$('#formTitle').textContent='給油履歴を編集';$('#submitFuel').textContent='変更を保存';$('#cancelEdit').hidden=false;window.scrollTo({top:0,behavior:'smooth'});}
    function renderMaintenance(){const list=$('#maintenanceList'),records=vehicleMaintenance();if(!records.length){list.innerHTML='<div class="empty">整備記録はまだありません</div>';return}list.innerHTML=records.map(x=>({x,index:maintenance.indexOf(x)})).sort((a,b)=>(a.x.nextDate||'9999').localeCompare(b.x.nextDate||'9999')).map(({x,index})=>`<div class="entry"><div><div class="fuel">${x.name}</div><div class="date">実施：${x.date} ・ ${x.odometer.toFixed(0)} km${x.nextDate?'　／　次回：'+x.nextDate:''}${x.nextOdo?' ・ '+x.nextOdo.toFixed(0)+' km':''}</div></div><button class="delete-button maintenance-delete" data-index="${index}" type="button">削除</button></div>`).join('');}
    function checkMaintenanceAlerts(){const today=new Date().toISOString().slice(0,10),latestOdo=[...vehicleLogs()].sort((a,b)=>b.date.localeCompare(a.date))[0]?.odometer||0,due=vehicleMaintenance().filter(x=>(x.nextDate&&x.nextDate<=today)||(x.nextOdo&&x.nextOdo<=latestOdo));if(!due.length)return;const details=due.map(x=>{const reasons=[];if(x.nextDate&&x.nextDate<=today)reasons.push(`目安日：${x.nextDate}`);if(x.nextOdo&&x.nextOdo<=latestOdo)reasons.push(`目安距離：${x.nextOdo.toFixed(0)} km`);return `・${x.name}（${reasons.join(' / ')}）`}).join('\n');alert(`整備の目安を迎えています。\n\n${details}\n\n現在のメーター距離：${latestOdo.toFixed(0)} km`);}
    function setupFilters(){const years=[...new Set(vehicleLogs().map(x=>x.date.slice(0,4)))].sort().reverse(),y=$('#year'),m=$('#monthSelect'),keep=y.value;y.innerHTML=years.map(v=>`<option value="${v}">${v}年</option>`).join('');y.value=years.includes(keep)?keep:years[0]||'';m.innerHTML=Array.from({length:12},(_,i)=>`<option value="${String(i+1).padStart(2,'0')}">${i+1}月</option>`).join('');m.value=String(new Date().getMonth()+1).padStart(2,'0');}
    function renderChart(){const mode=$('#range').value,year=$('#year').value,month=$('#monthSelect').value,records=vehicleLogs();let labels=[],totals=[];const value=x=>trendMetric==='cost'?x.cost:distance(x),format=v=>trendMetric==='cost'?yen(v):Math.round(v)+' km';
      if(mode==='six'){for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;labels.push(`${d.getMonth()+1}月`);totals.push(records.filter(x=>x.date.startsWith(k)).reduce((s,x)=>s+value(x),0))}$('#rangeLabel').textContent='直近6か月';}
      else if(mode==='year'){for(let i=1;i<=12;i++){const k=`${year}-${String(i).padStart(2,'0')}`;labels.push(i+'月');totals.push(records.filter(x=>x.date.startsWith(k)).reduce((s,x)=>s+value(x),0))}$('#rangeLabel').textContent=year+'年の月別';}
      else{const entries=records.filter(x=>x.date.startsWith(`${year}-${month}`)).sort((a,b)=>a.date.localeCompare(b.date));labels=entries.map(x=>x.date.slice(8)+'日');totals=entries.map(value);$('#rangeLabel').textContent=`${year}年${+month}月の給油別`;}
      const max=Math.max(...totals,1);$('#chart').innerHTML=labels.length?totals.map((v,i)=>`<div class="bar-wrap"><span class="bar-value">${v?trendMetric==='cost'?Math.round(v/1000)+'k':Math.round(v):''}</span><div class="bar" style="height:${v/max*135}px"></div><span class="bar-label">${labels[i]}</span></div>`).join(''):'<div class="empty">この月の給油記録はありません</div>';$('#totalCost').textContent='合計 '+format(totals.reduce((s,x)=>s+x,0));}
    renderVehicleSelect();setupFilters();resetFuelForm();$('#maintenanceDate').value=new Date().toISOString().slice(0,10);$('#maintenanceOdo').value=[...vehicleLogs()].sort((a,b)=>b.date.localeCompare(a.date))[0]?.odometer||'';render();checkMaintenanceAlerts();
    $('#previousOdo').addEventListener('input',updatePreview);$('#odometer').addEventListener('input',updatePreview);
    $('#form').addEventListener('submit',e=>{e.preventDefault();const f=e.target,item={date:f.date.value,previousOdo:+f.previousOdo.value,odometer:+f.odometer.value,liters:+f.liters.value,cost:+f.cost.value,vehicleId:activeVehicleId};if(distance(item)<=0){alert('今回のメーター距離は、前回より大きい値を入力してください。');return}if(editingIndex===null)logs.push(item);else logs[editingIndex]=item;save();setupFilters();resetFuelForm();render();});
    $('#cancelEdit').addEventListener('click',resetFuelForm);
    ['#range','#year','#monthSelect'].forEach(s=>$(s).addEventListener('change',renderChart));
    document.querySelectorAll('.metric-tab').forEach(button=>button.addEventListener('click',()=>{trendMetric=button.dataset.metric;document.querySelectorAll('.metric-tab').forEach(x=>x.classList.toggle('active',x===button));renderChart()}));
    $('#list').addEventListener('click',e=>{const edit=e.target.closest('.edit-button');if(edit){startEdit(+edit.dataset.index);return}const button=e.target.closest('.delete-button');if(!button)return;const index=+button.dataset.index,item=logs[index];if(confirm(`${item.date}の給油記録（${yen(item.cost)}）を削除します。\nこの操作は取り消せません。`)){logs.splice(index,1);save();setupFilters();resetFuelForm();render();}});
    $('#maintenanceForm').addEventListener('submit',e=>{e.preventDefault();const f=e.target;maintenance.push({name:f.maintenanceName.value.trim(),date:f.maintenanceDate.value,odometer:+f.maintenanceOdo.value,nextDate:f.nextDate.value,nextOdo:+f.nextOdo.value||0,vehicleId:activeVehicleId});saveMaintenance();f.reset();f.maintenanceDate.value=new Date().toISOString().slice(0,10);f.maintenanceOdo.value=[...vehicleLogs()].sort((a,b)=>b.date.localeCompare(a.date))[0]?.odometer||'';renderMaintenance();});
    $('#maintenanceList').addEventListener('click',e=>{const button=e.target.closest('.maintenance-delete');if(!button)return;const i=+button.dataset.index,item=maintenance[i];if(confirm(`${item.name}の整備記録を削除します。\nこの操作は取り消せません。`)){maintenance.splice(i,1);saveMaintenance();renderMaintenance();}});
    document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab,.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.tab).classList.add('active')}));
    $('#vehicleSelect').addEventListener('change',e=>{activeVehicleId=e.target.value;saveVehicles();setupFilters();resetFuelForm();$('#maintenanceOdo').value=[...vehicleLogs()].sort((a,b)=>b.date.localeCompare(a.date))[0]?.odometer||'';render();});
    $('#addVehicle').addEventListener('click',()=>{const name=prompt('追加する車両名を入力してください。');if(!name||!name.trim())return;const id='vehicle-'+Date.now();vehicles.push({id,name:name.trim()});activeVehicleId=id;saveVehicles();renderVehicleSelect();setupFilters();resetFuelForm();$('#maintenanceOdo').value='';render();});
    $('#resetAll').addEventListener('click',()=>{if(!confirm('車両・給油履歴・整備記録をすべて削除し、空の状態に戻します。\nCSVに書き出していないデータは復元できません。\n\nリセットしてよろしいですか？'))return;if(!confirm('最終確認です。\n全データを削除します。この操作は取り消せません。\n\n本当にリセットしますか？'))return;localStorage.removeItem(key);localStorage.removeItem(maintenanceKey);localStorage.removeItem(vehiclesKey);localStorage.removeItem(activeVehicleKey);localStorage.setItem(resetKey,'true');location.reload();});
    $('#export').addEventListener('click',()=>{const head='種類,日付,前回メーター距離(km),今回メーター距離(km),給油量(L),支払金額(円),整備内容,次回目安日,次回目安距離(km)',fuelRows=vehicleLogs().map(x=>['給油',x.date,x.previousOdo,x.odometer,x.liters,x.cost,'','',''].join(',')),maintenanceRows=vehicleMaintenance().map(x=>['整備',x.date,'',x.odometer,'','',x.name,x.nextDate||'',x.nextOdo||''].join(',')),blob=new Blob(['\ufeff'+[head,...fuelRows,...maintenanceRows].join('\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='drive-log-backup.csv';a.click();URL.revokeObjectURL(a.href)});
    $('#import').addEventListener('click',()=>$('#importFile').click());
    $('#importFile').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const lines=String(reader.result).replace(/^\uFEFF/,'').trim().split(/\r?\n/),unified=lines[0].startsWith('種類,');if(lines.length<2||!unified)throw new Error();const cells=line=>line.split(','),fuel=lines.slice(1).map(cells).filter(v=>v[0]==='給油').map(v=>({date:v[1],previousOdo:+v[2],odometer:+v[3],liters:+v[4],cost:+v[5],vehicleId:activeVehicleId})).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x.date)&&x.odometer>x.previousOdo&&x.liters>0&&x.cost>=0),service=lines.slice(1).map(cells).filter(v=>v[0]==='整備').map(v=>({name:v[6],date:v[1],odometer:+v[3],nextDate:v[7],nextOdo:+v[8]||0,vehicleId:activeVehicleId})).filter(x=>x.name&&/^\d{4}-\d{2}-\d{2}$/.test(x.date)&&x.odometer>=0);if(!fuel.length&&!service.length)throw new Error();if(confirm(`この車両の給油${fuel.length}件・整備${service.length}件で置き換えます。よろしいですか？`)){logs=[...logs.filter(x=>x.vehicleId!==activeVehicleId),...fuel];maintenance=[...maintenance.filter(x=>x.vehicleId!==activeVehicleId),...service];save();saveMaintenance();setupFilters();resetFuelForm();render();alert('データを読み込みました。')}}catch{alert('このCSVは読み込めませんでした。DRIVE LOGから書き出したデータを選んでください。')}e.target.value=''};reader.readAsText(file,'UTF-8')});
  </script>
</body>
</html>
